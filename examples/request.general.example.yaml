name: general-api-runtime-values
request:
  method: POST
  # Replace with the General API resource path documented for your deployment.
  path: /replace-with-general-api-path
  headers:
    Content-Type: application/json
    X-Request-ID: "{{uuid}}"
  body:
    requestId: "{{uuid}}"
    requestTime: "{{nowUtc}}"
    credentials:
      licenceKey: "{{env:SAF_GENERAL_LICENCE_KEY}}"
      password: "{{env:SAF_GENERAL_PASSWORD}}"
